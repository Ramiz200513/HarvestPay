server {
    listen 80;
    root /usr/share/nginx/html;

    # Запросы к API передаём контейнеру с FastAPI
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }

    # Все остальные пути отдаёт React-роутер (например /applications/<id>)
    location / {
        try_files $uri /index.html;
    }
}
