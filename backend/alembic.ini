# Настройки Alembic — инструмента миграций схемы БД.
# Адрес базы берётся не отсюда, а из настроек приложения (HP_DATABASE_URL) — см. migrations/env.py.
#
# Частые команды (из папки backend):
#   alembic upgrade head                          — применить все миграции (API делает это сам при старте)
#   alembic revision --autogenerate -m "текст"    — создать новую миграцию по изменениям в models.py
#   alembic history                               — список миграций

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
